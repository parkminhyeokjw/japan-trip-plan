<title>일본 여행 계획표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}

/* Layout: sticky header + day tabs, vertical timeline of time slots, bottom sheet editor */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17212b; --muted:#66727f; --line:#d5dbe1;
  --accent:#1f4e79; --accent-fg:#ffffff; --soft:#e1ebf5; --danger:#b3261e; --done:#8a96a2;
  --f-body:"Noto Sans KR",system-ui,sans-serif; --f-num:"Zen Kaku Gothic New","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#19222b; --fg:#e8edf2; --muted:#8e9aa6; --line:#2b3641;
  --accent:#7db3e8; --accent-fg:#0b1620; --soft:#1f3042; --danger:#f2867f; --done:#6b7782; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#19222b; --fg:#e8edf2; --muted:#8e9aa6; --line:#2b3641;
  --accent:#7db3e8; --accent-fg:#0b1620; --soft:#1f3042; --danger:#f2867f; --done:#6b7782; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.55;-webkit-text-size-adjust:100%;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
header{padding-top:18px}
#title{width:100%;border:0;background:transparent;color:var(--fg);font:700 28px/1.25 var(--f-body);padding:4px 0;border-bottom:1px dashed transparent;text-wrap:balance}
#title:focus{outline:none;border-bottom-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted);font-size:15px;margin-top:2px}
.meta label{white-space:nowrap}
.meta input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#sync{margin-left:auto}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:78px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 14px;text-align:center;font-family:var(--f-body);cursor:pointer}
.tab b{display:block;font:700 20px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.tab span{font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab[aria-selected="true"] span{color:inherit;opacity:.85}
.tab.add{min-width:48px;color:var(--accent);border-style:dashed;font-size:20px;align-self:stretch;display:grid;place-items:center}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:6px 0 10px}
.dayhead h2{margin:0;font-size:21px}
.dayhead small{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer;padding:4px 0}
ol{list-style:none;margin:0;padding:0}
li.slot{display:grid;grid-template-columns:60px 1fr;gap:0 10px;position:relative}
li.slot::before{content:"";position:absolute;left:68px;top:0;bottom:0;width:2px;background:var(--line)}
.time{font:700 19px/1.2 var(--f-num);font-variant-numeric:tabular-nums;text-align:right;padding-top:14px;color:var(--accent)}
.time.none{color:var(--muted);font-weight:500;font-size:15px}
.card{position:relative;margin:0 0 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:calc(100% - 14px)}
.card::before{content:"";position:absolute;left:-21px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.card.done::before{background:var(--accent)}
.card:focus-visible,.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.place{word-break:keep-all;font-weight:700;font-size:19px;overflow-wrap:anywhere}
.note{word-break:keep-all;grid-column:1;color:var(--muted);font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.card.done .place,.card.done .note{color:var(--done);text-decoration:line-through}
.map{grid-column:1;font-size:15px;color:var(--accent);text-decoration:none;margin-top:2px;width:max-content}
.chk{grid-row:1/3;grid-column:2;align-self:start;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--accent-fg);display:grid;place-items:center;font-size:18px;cursor:pointer;padding:0}
.card.done .chk{background:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:36px 12px;border:1px dashed var(--line);border-radius:10px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:28px;background:var(--accent);color:var(--accent-fg);font:700 18px var(--f-body);padding:16px 24px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;border-radius:16px 16px 0 0;background:var(--surface);color:var(--fg);width:100%;max-width:560px;margin:auto auto 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:15px;color:var(--muted)}
label input,label textarea,label select{font:16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:130px 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:4px}
.btns button{flex:1;border-radius:10px;padding:14px;font:700 17px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btns .pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btns .del{flex:0 0 auto;color:var(--danger)}
.hint{font-size:14px;color:var(--muted);margin:14px 0 0}
.incoming{margin:12px 0 0;background:var(--soft);border-radius:10px;padding:12px;font-size:16px}
.sharebox{display:grid;gap:6px;margin-top:18px}
.sharebox input{font:15px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
</style></head><body>

<div class="wrap">
  <header>
    <input id="title" aria-label="여행 제목" value="일본 여행 계획표">
    <div class="meta">
      <label style="display:flex;gap:6px;align-items:center;font-size:15px">출발일 <input id="start" type="date"></label>
      
    </div>
  </header>
  <div id="incoming" hidden class="incoming">친구가 보낸 일정이에요. 내 일정을 이 일정으로 바꿀까요?
    <div class="btns"><button type="button" id="inNo">그대로 두기</button><button type="button" class="pri" id="inYes">바꾸기</button></div></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="일차"></nav>
  <main id="main"></main>
  <div class="sharebox"><button type="button" class="linkbtn" id="share">친구에게 보낼 링크 만들기</button>
    <input id="shareOut" readonly hidden aria-label="공유 링크"></div>
  <p class="hint">일정은 이 폰에 자동 저장됩니다. 친구와 맞추려면 위 버튼으로 링크를 만들어 카톡으로 보내세요. 일정을 누르면 수정할 수 있고, 오른쪽 동그라미는 다녀옴 표시입니다.</p>
</div>
<button class="fab" id="addBtn">+ 일정 추가</button>

<dialog id="dlg">
  <form id="f" method="dialog">
    <div class="row">
      <label>시간<input id="fTime" type="time"></label>
      <label>장소<input id="fPlace" placeholder="예: 센소지, 시부야 스카이" autocomplete="off"></label>
    </div>
    <label>메모<textarea id="fNote" placeholder="뭐 할지, 뭐 먹을지, 교통편, 예약 번호 등"></textarea></label>
    <div class="btns">
      <button type="button" class="del" id="fDel">삭제</button>
      <button type="button" id="fCancel">취소</button>
      <button type="submit" class="pri">저장</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  var KEY="japan-trip-plan-v1";
  var uid=function(){return Math.random().toString(36).slice(2,9)};
  function pad(n){return n<10?"0"+n:""+n}
  function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function defaultState(){
    var d=new Date(); d.setDate(d.getDate()+3);
    return {title:"일본 여행 계획표",start:ymd(d),days:[
      {items:[
        {id:uid(),time:"09:00",place:"공항 도착 (예시)",note:"입국 심사 후 교통카드 구입, 호텔로 이동",done:false},
        {id:uid(),time:"13:00",place:"점심 (예시)",note:"먹고 싶은 가게를 여기에 적기",done:false},
        {id:uid(),time:"15:00",place:"호텔 체크인 (예시)",note:"예약 번호:",done:false}]},
      {items:[]},{items:[]}]};
  }
  var S=null, cur=0, editing=null, db=null, ref=null, mode="local", lastSaved="";
  var DOW=["일","월","화","수","목","금","토"];

  function load(){
    try{var r=localStorage.getItem(KEY); if(r) return JSON.parse(r)}catch(e){}
    return null;
  }
  function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  var saveTimer=null;
  function save(){
    saveLocal();
    if(ref){
      clearTimeout(saveTimer);
      saveTimer=setTimeout(function(){
        var j=JSON.stringify(S); lastSaved=j;
        ref.set({json:j}).catch(function(){setSync("local")});
      },400);
    }
  }
  function setSync(m){
    mode=m;
    var el=document.getElementById("sync");
    el.textContent = m==="shared" ? "친구와 공유 중" : "이 폰에만 저장";
  }
  function dateOf(i){var p=S.start.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]+i); return d}
  function esc(s){return s}
  function mapUrl(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}

  function render(){
    document.getElementById("title").value=S.title;
    document.getElementById("start").value=S.start;
    if(cur>=S.days.length) cur=S.days.length-1;
    var tabs=document.getElementById("tabs"); tabs.innerHTML="";
    S.days.forEach(function(_,i){
      var d=dateOf(i), b=document.createElement("button");
      b.className="tab"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",i===cur);
      b.innerHTML="<b></b><span></span>";
      b.firstChild.textContent=(d.getMonth()+1)+"/"+d.getDate();
      b.lastChild.textContent=(i+1)+"일차 · "+DOW[d.getDay()];
      b.onclick=function(){cur=i;try{localStorage.setItem(KEY+"-tab",i)}catch(e){}render()};
      tabs.appendChild(b);
    });
    var add=document.createElement("button"); add.className="tab add"; add.textContent="+"; add.setAttribute("aria-label","일차 추가");
    add.onclick=function(){S.days.push({items:[]});cur=S.days.length-1;save();render()};
    tabs.appendChild(add);
    var sel=tabs.children[cur]; if(sel&&sel.scrollIntoView) sel.scrollIntoView({inline:"center",block:"nearest"});

    var day=S.days[cur], d=dateOf(cur), main=document.getElementById("main");
    main.innerHTML="";
    var head=document.createElement("div"); head.className="dayhead";
    var h=document.createElement("h2"); h.textContent=(cur+1)+"일차 · "+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")";
    head.appendChild(h);
    if(S.days.length>1){
      var rm=document.createElement("button"); rm.className="linkbtn"; rm.textContent="이 날 지우기";
      rm.onclick=function(){
        if(rm.dataset.sure!=="1"){rm.dataset.sure="1";rm.textContent="한 번 더 누르면 지워져요";return}
        S.days.splice(cur,1);cur=Math.max(0,cur-1);save();render();
      };
      head.appendChild(rm);
    }
    main.appendChild(head);

    if(!day.items.length){
      var e=document.createElement("div"); e.className="empty"; e.textContent="아직 일정이 없어요. 아래 '일정 추가'로 시간대별 계획을 적어보세요.";
      main.appendChild(e); return;
    }
    var items=day.items.slice().sort(function(a,b){
      if(!a.time&&!b.time) return 0; if(!a.time) return 1; if(!b.time) return -1;
      return a.time<b.time?-1:a.time>b.time?1:0;
    });
    var ol=document.createElement("ol");
    items.forEach(function(it){
      var li=document.createElement("li"); li.className="slot";
      var t=document.createElement("div"); t.className="time"+(it.time?"":" none"); t.textContent=it.time||"미정";
      var c=document.createElement("div"); c.className="card"+(it.done?" done":""); c.tabIndex=0; c.setAttribute("role","button");
      var p=document.createElement("div"); p.className="place"; p.textContent=it.place||"(장소 없음)";
      var ck=document.createElement("button"); ck.className="chk"; ck.type="button"; ck.textContent=it.done?"✓":""; ck.setAttribute("aria-label","다녀옴 표시");
      ck.onclick=function(ev){ev.stopPropagation();it.done=!it.done;save();render()};
      c.appendChild(p); c.appendChild(ck);
      if(it.note){var n=document.createElement("div"); n.className="note"; n.textContent=it.note; c.appendChild(n)}
      if(it.place){var a=document.createElement("a"); a.className="map"; a.href=mapUrl(it.place); a.target="_blank"; a.rel="noopener"; a.textContent="지도에서 보기 ↗"; a.onclick=function(ev){ev.stopPropagation()}; c.appendChild(a)}
      c.onclick=function(){openEdit(it)};
      c.onkeydown=function(ev){if(ev.key==="Enter"&&ev.target===c)openEdit(it)};
      li.appendChild(t); li.appendChild(c); ol.appendChild(li);
    });
    main.appendChild(ol);
  }

  var dlg=document.getElementById("dlg");
  function openEdit(it){
    editing=it||null;
    document.getElementById("fTime").value=it?it.time:"";
    document.getElementById("fPlace").value=it?it.place:"";
    document.getElementById("fNote").value=it?it.note:"";
    document.getElementById("fDel").style.display=it?"":"none";
    dlg.showModal();
    if(!it) document.getElementById("fTime").focus();
  }
  document.getElementById("addBtn").onclick=function(){openEdit(null)};
  document.getElementById("fCancel").onclick=function(){dlg.close()};
  dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
  document.getElementById("fDel").onclick=function(){
    var items=S.days[cur].items, i=items.indexOf(editing);
    if(i>=0) items.splice(i,1);
    dlg.close(); save(); render();
  };
  document.getElementById("f").onsubmit=function(e){
    e.preventDefault();
    var v={time:document.getElementById("fTime").value,place:document.getElementById("fPlace").value.trim(),note:document.getElementById("fNote").value.trim()};
    if(!v.place&&!v.note&&!v.time){dlg.close();return}
    if(editing){editing.time=v.time;editing.place=v.place;editing.note=v.note}
    else S.days[cur].items.push({id:uid(),time:v.time,place:v.place,note:v.note,done:false});
    dlg.close(); save(); render();
  };
  document.getElementById("title").oninput=function(e){S.title=e.target.value;save()};
  document.getElementById("start").onchange=function(e){if(e.target.value){S.start=e.target.value;save();render()}};

  S=load()||defaultState();
  try{var tb=+localStorage.getItem(KEY+"-tab"); if(tb>=0&&tb<S.days.length) cur=tb}catch(e){}
  render();

  // 공유 링크: 일정 전체를 주소 뒤에 담아 보냄
  function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  function dec(t){t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return JSON.parse(decodeURIComponent(escape(atob(t))))}
  var m=location.hash.match(/^#d=(.+)$/);
  if(m){try{
    var inc=dec(m[1]); var bar=document.getElementById("incoming"); bar.hidden=false;
    document.getElementById("inYes").onclick=function(){S=inc;cur=0;saveLocal();history.replaceState(null,"",location.pathname);bar.hidden=true;render()};
    document.getElementById("inNo").onclick=function(){history.replaceState(null,"",location.pathname);bar.hidden=true};
  }catch(e){}}
  var shareBtn=document.getElementById("share"), shareOut=document.getElementById("shareOut");
  shareBtn.onclick=function(){
    var url=location.origin+location.pathname+"#d="+enc(S);
    shareOut.hidden=false; shareOut.value=url; shareOut.focus(); shareOut.select();
    var done=function(){shareBtn.textContent="링크 복사됨"; setTimeout(function(){shareBtn.textContent="친구에게 보낼 링크 만들기"},2500)};
    try{navigator.clipboard.writeText(url).then(done,function(){})}catch(e){}
  };
})();
</script>
</body></html>
