<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f4e79">
<title>일본 여행 계획표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: header + day tabs + vertical timeline (plan) or checklist (packing), fixed bottom tab bar */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17212b; --muted:#66727f; --line:#d5dbe1;
  --accent:#1f4e79; --accent-fg:#ffffff; --soft:#e1ebf5; --danger:#b3261e; --done:#8a96a2; --ok:#2e7d4f;
  --f-body:"Noto Sans KR",system-ui,sans-serif; --f-num:"Zen Kaku Gothic New","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#19222b; --fg:#e8edf2; --muted:#8e9aa6; --line:#2b3641;
  --accent:#7db3e8; --accent-fg:#0b1620; --soft:#1f3042; --danger:#f2867f; --done:#6b7782; --ok:#6fcf97; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#19222b; --fg:#e8edf2; --muted:#8e9aa6; --line:#2b3641;
  --accent:#7db3e8; --accent-fg:#0b1620; --soft:#1f3042; --danger:#f2867f; --done:#6b7782; --ok:#6fcf97; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 130px}
.wrap{max-width:560px;margin:0 auto}
header{padding-top:14px}
#title{width:100%;border:0;background:transparent;color:var(--fg);font:700 26px/1.25 var(--f-body);padding:2px 0;border-bottom:1px dashed transparent;text-wrap:balance}
#title:focus{outline:none;border-bottom-color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--muted);font-size:15px;margin-top:2px}
.meta label{display:flex;gap:6px;align-items:center;white-space:nowrap}
.meta input{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 6px;min-width:0}
#name{width:96px}
#sync{font-size:13px;display:flex;align-items:center;gap:6px;margin-top:2px;color:var(--muted)}
#sync i{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
#sync.on i{background:var(--ok)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:6px 2px;text-align:center;font-family:var(--f-body);cursor:pointer}
.tab b{display:block;font:700 18px/1.25 var(--f-num);font-variant-numeric:tabular-nums}
.tab span{white-space:nowrap;font-size:11.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab[aria-selected="true"] span{color:inherit;opacity:.9}
.tab.today span{font-weight:700;color:var(--accent)}
.tab.today[aria-selected="true"] span{color:inherit}
.tab.add{min-width:48px;color:var(--accent);border-style:dashed;font-size:20px;align-self:stretch;display:grid;place-items:center}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:8px 0 8px}
.dayhead h2{margin:0;font-size:19px}
.linkbtn{border:0;background:none;color:var(--muted);font:inherit;font-size:15px;text-decoration:underline;cursor:pointer;padding:4px 0}
ol{list-style:none;margin:0;padding:0}
li.slot{display:grid;grid-template-columns:54px 1fr;gap:0 10px;position:relative}
li.slot::before{content:"";position:absolute;left:62px;top:0;bottom:0;width:2px;background:var(--line)}
.time{font:700 17px/1.2 var(--f-num);font-variant-numeric:tabular-nums;text-align:right;padding-top:12px;color:var(--accent)}
.time.none{color:var(--muted);font-weight:500;font-size:14px}
.card{position:relative;margin:0 0 8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 14px;min-width:0;display:grid;grid-template-columns:1fr auto;gap:0 10px;line-height:1.4;cursor:pointer;text-align:left;font:inherit;color:inherit;width:calc(100% - 14px)}
.card::before{content:"";position:absolute;left:-21px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.card.done::before{background:var(--accent)}
.card.now{border:2px solid var(--accent);padding:8px 13px}
.card.now::before{background:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.badge{grid-column:1;font-size:12px;font-weight:700;color:var(--accent)}
.card:focus-visible,.tab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.place{word-break:keep-all;font-weight:700;font-size:17px;overflow-wrap:anywhere}
.note{word-break:keep-all;grid-column:1;color:var(--muted);font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.card.done .place,.card.done .note{color:var(--done);text-decoration:line-through}
.links{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:0 14px;margin-top:1px}
.links a{font-size:14px;color:var(--accent);text-decoration:none;padding:3px 0}
.chk{grid-row:1/3;grid-column:2;align-self:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--accent-fg);display:grid;place-items:center;font-size:15px;cursor:pointer;padding:0}
.card.done .chk{background:var(--accent);border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:36px 12px;border:1px dashed var(--line);border-radius:10px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:28px;background:var(--accent);color:var(--accent-fg);font:700 16px var(--f-body);padding:12px 20px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:7;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-top:1px solid var(--line);padding:0 max(0px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)}
.bar button{border:0;background:none;color:var(--muted);font:700 16px var(--f-body);padding:12px 0;cursor:pointer}
.bar button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
dialog{border:0;border-radius:16px 16px 0 0;background:var(--surface);color:var(--fg);width:100%;max-width:560px;margin:auto auto 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
form{display:grid;gap:12px}
label.f{display:grid;gap:4px;font-size:15px;color:var(--muted)}
label.f input,label.f textarea,label.f select{font:16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:130px 1fr;gap:10px}
.btns{display:flex;gap:10px;margin-top:4px}
.btns button{flex:1;border-radius:12px;padding:11px;font:700 16px var(--f-body);border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.btns .pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btns .del{flex:0 0 auto;color:var(--danger)}
.btns .mv{flex:0 0 auto;padding:10px 16px}
.hint{font-size:13px;color:var(--muted);margin:14px 0 0}
.incoming{margin:12px 0 0;background:var(--soft);border-radius:10px;padding:12px;font-size:16px}
.placerow{display:flex;gap:8px}
label.f .placerow input{width:auto;flex:1}
.locbtn{flex:0 0 auto;border:1px solid var(--accent);background:var(--soft);color:var(--accent);border-radius:8px;font:700 15px var(--f-body);padding:0 14px;cursor:pointer}
.loct{font-size:13px;color:var(--muted);margin-top:-6px}
dialog#mapDlg{height:88%;max-height:88%;padding:14px max(14px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.mapwrap{display:flex;flex-direction:column;gap:10px;height:100%;min-height:0}
.mapsearch{display:flex;gap:8px}
.mapsearch input{flex:1;min-width:0;font:16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mapsearch button{flex:0 0 auto;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font:700 16px var(--f-body);padding:0 16px;cursor:pointer}
#mRes{display:grid;gap:6px;max-height:150px;overflow-y:auto}
#mRes button{text-align:left;font:15px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere}
#mapBox{flex:1;min-height:240px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--soft)}
.mapmsg{font-size:13px;color:var(--muted)}
.pin{display:block;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#d93025;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.leaflet-container{font-family:var(--f-body)}
/* packing */
.addrow{display:flex;gap:8px;margin:6px 0 14px}
.addrow input{flex:1;min-width:0;font:16px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.addrow button{flex:0 0 auto;border:0;border-radius:10px;background:var(--accent);color:var(--accent-fg);font:700 16px var(--f-body);padding:0 18px;cursor:pointer}
.sec{font-size:14px;color:var(--muted);margin:12px 0 6px;font-weight:700}
.pk{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:6px;line-height:1.4}
.pk .box{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:none;color:var(--accent-fg);font-size:18px;display:grid;place-items:center;cursor:pointer;padding:0}
.pk.done .box{background:var(--accent);border-color:var(--accent)}
.pk .tx{flex:1;min-width:0;word-break:keep-all;overflow-wrap:anywhere;cursor:pointer;background:none;border:0;text-align:left;font:inherit;color:inherit;padding:0}
.pk.done .tx{color:var(--done);text-decoration:line-through}
.pk small{display:block;color:var(--muted);font-size:13px}
.pk .x{flex:0 0 auto;border:0;background:none;color:var(--muted);font-size:24px;line-height:1;padding:4px 8px;cursor:pointer}
</style></head><body>
<div class="wrap">
  <header>
    <input id="title" aria-label="여행 제목" value="일본 여행 계획표">
    <div id="sync"><i></i><span>연결 중…</span></div>
  </header>

  <section id="planView">
    <nav class="tabs" id="tabs" role="tablist" aria-label="일차"></nav>
    <main id="main"></main>
  </section>

  <section id="packView" hidden>
    <h2 style="font-size:19px;margin:12px 0 2px">준비물</h2>
    <p style="margin:0 0 8px;font-size:13px;color:var(--muted)">목록은 친구와 같이 쓰고, 체크는 내 폰에만 저장돼요.</p>
    <form class="addrow" id="packForm"><input id="packIn" placeholder="가져갈 것 (예: 여권, 충전기)" maxlength="100" autocomplete="off" aria-label="준비물 추가"><button type="submit">추가</button></form>
    <div id="packList"></div>
  </section>

  <p class="hint">일정은 이 폰에 먼저 저장되고, 와이파이나 데이터가 연결되면 친구와 자동으로 맞춰져요. <button type="button" class="linkbtn" id="copyUrl">주소 복사</button></p>
</div>
<button class="fab" id="addBtn">+ 일정 추가</button>
<nav class="bar" role="tablist" aria-label="화면"><button id="tPlan" role="tab" aria-selected="true">계획표</button><button id="tPack" role="tab" aria-selected="false">준비물</button></nav>

<dialog id="dlg">
  <form id="f" method="dialog">
    <div class="row">
      <label class="f">날짜<select id="fDay"></select></label>
      <label class="f">시간<input id="fTime" type="time"></label>
    </div>
    <label class="f">장소<span class="placerow"><input id="fPlace" placeholder="예: 센소지, 시부야 스카이" autocomplete="off"><button type="button" class="locbtn" id="fLoc">위치</button></span></label>
    <div class="loct" id="fLocT"></div>
    <label class="f">메모<textarea id="fNote" placeholder="뭐 할지, 뭐 먹을지, 교통편 등"></textarea></label>
    <div class="btns" id="mvRow"><button type="button" class="mv" id="fUp">▲ 위로</button><button type="button" class="mv" id="fDown">▼ 아래로</button></div>
    <div class="btns">
      <button type="button" class="del" id="fDel">삭제</button>
      <button type="button" id="fCancel">취소</button>
      <button type="submit" class="pri">저장</button>
    </div>
  </form>
</dialog>

<dialog id="mapDlg" aria-label="위치 지정">
  <div class="mapwrap">
    <div class="mapsearch"><input id="mQ" placeholder="장소 검색 (예: 센소지, 시부야역)" autocomplete="off"><button type="button" id="mGo">검색</button></div>
    <div id="mRes"></div>
    <div id="mapBox"></div>
    <div class="mapmsg" id="mMsg"></div>
    <div class="btns">
      <button type="button" class="del" id="mClear">위치 지우기</button>
      <button type="button" id="mCancel">취소</button>
      <button type="button" class="pri" id="mOk">이 위치로</button>
    </div>
  </div>
</dialog>

<script>
(function(){
  /* ---------- 설정 ---------- */
  var TOPIC="jtp-yebPBOKGAHATDdcrpnLziHrR";           // 두 폰이 같은 방을 쓰기 위한 이름
  var BASE="https://ntfy.sh/"+TOPIC;
  var K_CK="jtp2-checks", K_R="jtp2-records", K_D="jtp2-dirty", K_N="jtp2-name", K_TAB="jtp2-tab", K_VIEW="jtp2-view";
  var DOW=["일","월","화","수","목","금","토"];
  var START="2026-11-09", DAYS=5;                    // 11/9 ~ 11/13 고정

  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function uid(){return Math.random().toString(36).slice(2,10)}
  function pad(n){return n<10?"0"+n:""+n}
  function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function $(id){return document.getElementById(id)}

  /* ---------- 데이터: 키별 기록(R[key]={v,t}), 나중 시각이 이김, 지운 건 v:null ---------- */
  var R={}, dirty={}, lastT=0, seenT={};
  function seeds(){
    var o={meta:{v:{title:"일본 여행 계획표"},t:1}};
    [["s1","09:00","공항 도착 (예시)","입국 심사 후 교통카드 구입, 호텔로 이동",1],
     ["s2","13:00","점심 (예시)","먹고 싶은 가게를 여기에 적기",2],
     ["s3","15:00","호텔 체크인 (예시)","예약 번호는 친구와 직접 공유",3]].forEach(function(a){
      o["i:"+a[0]]={v:{day:0,time:a[1],place:a[2],note:a[3],done:false,ord:a[4]},t:1}});
    ["여권","충전기·보조배터리","멀티 어댑터(돼지코)","엔화 현금","eSIM 또는 포켓와이파이"].forEach(function(x,i){
      o["p:s"+i]={v:{text:x,done:false,by:"",doneBy:""},t:1}});
    return o;
  }
  function loadState(){
    try{var r=JSON.parse(lsGet(K_R)||"null"); if(r&&typeof r==="object")R=r}catch(e){}
    if(!R.meta){var s=seeds(); for(var k in s) if(!R[k]) R[k]=s[k]}
    try{var d=JSON.parse(lsGet(K_D)||"{}"); if(d&&typeof d==="object")dirty=d}catch(e){}
    for(var k2 in R) if(R[k2].t>lastT) lastT=R[k2].t;
  }
  function saveR(){lsSet(K_R,JSON.stringify(R))}
  function saveD(){lsSet(K_D,JSON.stringify(dirty))}
  function tick(){var n=Date.now(); if(n<=lastT)n=lastT+1; lastT=n; return n}
  function setRec(key,v){var t=tick(); R[key]={v:v,t:t}; saveR(); dirty[key]=t; saveD(); render(); scheduleFlush()}

  function str(x,n){return typeof x==="string"?x.slice(0,n):""}
  function clean(key,v){
    if(v===null) return null;
    if(!v||typeof v!=="object") return undefined;
    if(key==="meta"){
      return {title:str(v.title,100)};
    }
    if(key.indexOf("i:")===0){
      var day=parseInt(v.day,10); if(!(day>=0&&day<DAYS)) return undefined;
      var ok=typeof v.lat==="number"&&typeof v.lng==="number"&&isFinite(v.lat)&&isFinite(v.lng)&&Math.abs(v.lat)<=90&&Math.abs(v.lng)<=180;
      return {day:day,time:/^\d\d:\d\d$/.test(v.time)?v.time:"",place:str(v.place,200),note:str(v.note,2000),done:v.done===true,ord:typeof v.ord==="number"?v.ord:0,lat:ok?v.lat:null,lng:ok?v.lng:null};
    }
    if(key.indexOf("p:")===0) return {text:str(v.text,100),done:v.done===true,by:str(v.by,12),doneBy:str(v.doneBy,12)};
    return undefined;
  }
  function validKey(k){return typeof k==="string"&&k.length<40&&(k==="meta"||/^[ip]:[A-Za-z0-9]{1,16}$/.test(k))}
  function merge(key,rec){
    var c=R[key];
    if(!c||rec.t>c.t||(rec.t===c.t&&JSON.stringify(rec.v)>JSON.stringify(c.v))){
      R[key]={v:rec.v,t:rec.t}; if(rec.t>lastT)lastT=rec.t; return true}
    return false;
  }

  function meta(){return R.meta&&R.meta.v||{title:"일본 여행 계획표"}}
  function itemsOf(day){
    var a=[];
    for(var k in R){ if(k.indexOf("i:")===0&&R[k].v&&R[k].v.day===day) a.push({id:k.slice(2),key:k,v:R[k].v}) }
    a.sort(function(x,y){
      var tx=x.v.time||"~", ty=y.v.time||"~"; if(tx!==ty) return tx<ty?-1:1;
      if(x.v.ord!==y.v.ord) return x.v.ord-y.v.ord; return x.id<y.id?-1:1});
    return a;
  }
  function packs(){
    var a=[]; for(var k in R){ if(k.indexOf("p:")===0&&R[k].v) a.push({key:k,v:R[k].v,t:R[k].t}) }
    a.sort(function(x,y){return y.t-x.t}); return a;
  }

  /* ---------- 화면 ---------- */
  var cur=0, view="plan", editing=null;
  var CK={}; try{CK=JSON.parse(lsGet(K_CK)||"{}")||{}}catch(e){CK={}}   // 준비물 체크: 이 폰에만 저장
  function dateOf(i){var p=START.split("-"); return new Date(+p[0],+p[1]-1,+p[2]+i)}
  function todayIdx(){
    var p=START.split("-"), s=Date.UTC(+p[0],+p[1]-1,+p[2]), n=new Date(), t=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
    var i=Math.round((t-s)/86400000); return (i>=0&&i<DAYS)?i:-1;
  }
  function mapUrl(q){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q)}
  function hasLoc(v){return typeof v.lat==="number"&&typeof v.lng==="number"}
  function locStr(v){return hasLoc(v)?(v.lat+","+v.lng):v.place}
  function dirUrl(a,b){return "https://www.google.com/maps/dir/?api=1&travelmode=transit&origin="+encodeURIComponent(a)+"&destination="+encodeURIComponent(b)}

  var rafPending=false;
  function renderSoon(){ if(rafPending)return; rafPending=true; setTimeout(function(){rafPending=false;render()},50) }

  function render(){
    var m=meta();
    if(document.activeElement!==$("title")) $("title").value=m.title;
    $("planView").hidden=view!=="plan"; $("packView").hidden=view!=="pack"; $("addBtn").hidden=view!=="plan";
    $("tPlan").setAttribute("aria-selected",view==="plan"); $("tPack").setAttribute("aria-selected",view==="pack");
    if(view==="plan") renderPlan(); else renderPack();
  }

  function renderPlan(){
    if(cur>=DAYS) cur=DAYS-1; if(cur<0) cur=0;
    var td=todayIdx();
    var tabs=$("tabs"); tabs.innerHTML="";
    for(var i=0;i<DAYS;i++)(function(i){
      var d=dateOf(i), b=document.createElement("button");
      b.className="tab"+(i===td?" today":""); b.setAttribute("role","tab"); b.setAttribute("aria-selected",i===cur);
      b.innerHTML="<b></b><span></span>";
      b.firstChild.textContent=(d.getMonth()+1)+"/"+d.getDate();
      b.lastChild.textContent=i===td?"오늘 · "+DOW[d.getDay()]:(i+1)+"일차 · "+DOW[d.getDay()];
      b.onclick=function(){cur=i;lsSet(K_TAB,i);render()};
      tabs.appendChild(b);
    })(i);
    var sel=tabs.children[cur]; if(sel&&sel.scrollIntoView) sel.scrollIntoView({inline:"center",block:"nearest"});

    var d=dateOf(cur), main=$("main"); main.innerHTML="";
    var head=document.createElement("div"); head.className="dayhead";
    var h=document.createElement("h2"); h.textContent=(cur+1)+"일차 · "+(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")";
    head.appendChild(h);
    main.appendChild(head);

    var items=itemsOf(cur);
    if(!items.length){
      var e=document.createElement("div"); e.className="empty"; e.textContent="아직 일정이 없어요. 아래 '일정 추가'로 시간대별 계획을 적어보세요.";
      main.appendChild(e); return;
    }
    var n=new Date(), nowS=pad(n.getHours())+":"+pad(n.getMinutes()), nowKey=null;
    if(cur===td){ items.forEach(function(it){ if(it.v.time&&it.v.time<=nowS) nowKey=it.key }) }
    var ol=document.createElement("ol"), prevRef="";
    items.forEach(function(it){
      var v=it.v, li=document.createElement("li"); li.className="slot";
      var t=document.createElement("div"); t.className="time"+(v.time?"":" none"); t.textContent=v.time||"미정";
      var c=document.createElement("div"); c.className="card"+(v.done?" done":"")+(it.key===nowKey?" now":""); c.tabIndex=0; c.setAttribute("role","button");
      if(it.key===nowKey){var bd=document.createElement("div"); bd.className="badge"; bd.textContent="지금 이 시간"; c.appendChild(bd)}
      var p=document.createElement("div"); p.className="place"; p.textContent=v.place||"(장소 없음)";
      var ck=document.createElement("button"); ck.className="chk"; ck.type="button"; ck.textContent=v.done?"✓":""; ck.setAttribute("aria-label","다녀옴 표시");
      ck.onclick=function(ev){ev.stopPropagation(); var nv=Object.assign({},v,{done:!v.done}); setRec(it.key,nv)};
      c.appendChild(p); c.appendChild(ck);
      if(v.note){var nt=document.createElement("div"); nt.className="note"; nt.textContent=v.note; c.appendChild(nt)}
      if(v.place||hasLoc(v)){
        var ls=document.createElement("div"); ls.className="links";
        var a=document.createElement("a"); a.href=mapUrl(locStr(v)); a.target="_blank"; a.rel="noopener"; a.textContent="지도 ↗"; a.onclick=function(ev){ev.stopPropagation()}; ls.appendChild(a);
        if(prevRef){var a2=document.createElement("a"); a2.href=dirUrl(prevRef,locStr(v)); a2.target="_blank"; a2.rel="noopener"; a2.textContent="이전 장소에서 길찾기 ↗"; a2.onclick=function(ev){ev.stopPropagation()}; ls.appendChild(a2)}
        c.appendChild(ls);
      }
      if(v.place||hasLoc(v)) prevRef=locStr(v);
      c.onclick=function(){openEdit(it)};
      c.onkeydown=function(ev){if(ev.key==="Enter"&&ev.target===c)openEdit(it)};
      li.appendChild(t); li.appendChild(c); ol.appendChild(li);
    });
    main.appendChild(ol);
  }

  function renderPack(){
    var list=$("packList"); list.innerHTML="";
    var all=packs(), todo=all.filter(function(p){return !CK[p.key]}), done=all.filter(function(p){return CK[p.key]});
    function sec(label,arr){
      if(!arr.length) return;
      var h=document.createElement("div"); h.className="sec"; h.textContent=label+" "+arr.length; list.appendChild(h);
      arr.forEach(function(p){
        var r=document.createElement("div"); r.className="pk"+(CK[p.key]?" done":"");
        var bx=document.createElement("button"); bx.type="button"; bx.className="box"; bx.textContent=CK[p.key]?"✓":""; bx.setAttribute("aria-label","챙김 표시");
        var tx=document.createElement("button"); tx.type="button"; tx.className="tx"; tx.textContent=p.v.text;
        var tog=function(){ if(CK[p.key]) delete CK[p.key]; else CK[p.key]=1; lsSet(K_CK,JSON.stringify(CK)); render() };
        bx.onclick=tog; tx.onclick=tog;
        var x=document.createElement("button"); x.type="button"; x.className="x"; x.textContent="×"; x.setAttribute("aria-label","삭제");
        x.onclick=function(){ if(x.dataset.sure!=="1"){x.dataset.sure="1";x.textContent="삭제?";x.style.color="var(--danger)";x.style.fontSize="15px";return} setRec(p.key,null)};
        r.appendChild(bx); r.appendChild(tx); r.appendChild(x); list.appendChild(r);
      });
    }
    if(!all.length){var e=document.createElement("div"); e.className="empty"; e.textContent="아직 준비물이 없어요. 위 칸에 가져갈 것을 적어 추가하세요."; list.appendChild(e)}
    sec("챙길 것",todo); sec("챙김 완료",done);
  }

  /* ---------- 일정 편집창 ---------- */
  var dlg=$("dlg"), pin=null;
  function showLoc(){
    $("fLocT").textContent=pin?"위치 지정됨 ("+pin.lat.toFixed(4)+", "+pin.lng.toFixed(4)+"). 카드의 '지도'를 누르면 이 위치가 열려요.":"위치를 지정하면 카드의 '지도'가 그 자리를 정확히 열어요.";
    $("fLoc").textContent=pin?"위치 ✓":"위치";
  }
  function openEdit(it){
    editing=it||null; var sel=$("fDay"); sel.innerHTML="";
    for(var i=0;i<DAYS;i++){var o=document.createElement("option"); o.value=i; var d=dateOf(i); o.textContent=(i+1)+"일차 ("+(d.getMonth()+1)+"/"+d.getDate()+")"; sel.appendChild(o)}
    sel.value=it?it.v.day:cur;
    $("fTime").value=it?it.v.time:""; $("fPlace").value=it?it.v.place:""; $("fNote").value=it?it.v.note:"";
    pin=(it&&hasLoc(it.v))?{lat:it.v.lat,lng:it.v.lng}:null; showLoc();
    $("fDel").style.display=it?"":"none"; $("mvRow").style.display=it?"":"none";
    dlg.showModal(); if(!it) $("fTime").focus();
  }
  $("addBtn").onclick=function(){openEdit(null)};
  $("fCancel").onclick=function(){dlg.close()};
  dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
  $("fDel").onclick=function(){ if(editing) setRec(editing.key,null); dlg.close() };
  function move(dir){
    if(!editing) return;
    var day=editing.v.day, list=itemsOf(day), i=-1;
    list.forEach(function(x,j){if(x.key===editing.key)i=j});
    var o=list[i+dir]; if(!o) return;
    var a=list[i], av=a.v, ov=o.v;
    var ord=av.ord===ov.ord?ov.ord+dir*0.5:ov.ord, ord2=av.ord===ov.ord?av.ord:av.ord;
    setRec(a.key,Object.assign({},av,{time:ov.time,ord:ord}));
    setRec(o.key,Object.assign({},ov,{time:av.time,ord:ord2}));
    dlg.close();
  }
  $("fUp").onclick=function(){move(-1)}; $("fDown").onclick=function(){move(1)};
  $("f").onsubmit=function(e){
    e.preventDefault();
    var time=$("fTime").value, place=$("fPlace").value.trim(), note=$("fNote").value.trim(), day=parseInt($("fDay").value,10)||0;
    if(!place&&!note&&!time&&!pin){dlg.close();return}
    if(editing){ setRec(editing.key,Object.assign({},editing.v,{day:day,time:time,place:place,note:note,lat:pin?pin.lat:null,lng:pin?pin.lng:null})); cur=day }
    else { setRec("i:"+uid(),{day:day,time:time,place:place,note:note,done:false,ord:Date.now(),lat:pin?pin.lat:null,lng:pin?pin.lng:null}); cur=day }
    dlg.close();
  };


  /* ---------- 지도에서 위치 찍기 (Leaflet + OpenStreetMap) ---------- */
  var mapDlg=$("mapDlg"), map=null, marker=null, tmp=null, leafletP=null;
  function mmsg(t){$("mMsg").textContent=t}
  function loadLeaflet(){
    if(window.L) return Promise.resolve();
    if(leafletP) return leafletP;
    leafletP=new Promise(function(res,rej){
      var l=document.createElement("link"); l.rel="stylesheet"; l.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(l);
      var sc=document.createElement("script"); sc.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"; sc.onload=res; sc.onerror=function(){leafletP=null; rej(new Error("load"))};
      document.head.appendChild(sc);
    });
    return leafletP;
  }
  function rnd(n){return Math.round(n*1e6)/1e6}
  function setPin(lat,lng){
    tmp={lat:rnd(lat),lng:rnd(lng)};
    if(!marker){
      marker=L.marker([lat,lng],{draggable:true,icon:L.divIcon({className:"",html:'<span class="pin"></span>',iconSize:[26,26],iconAnchor:[13,30]})}).addTo(map);
      marker.on("dragend",function(){var p=marker.getLatLng(); tmp={lat:rnd(p.lat),lng:rnd(p.lng)}});
    } else marker.setLatLng([lat,lng]);
  }
  function showResults(list){
    var box=$("mRes"); box.innerHTML="";
    if(!list.length){mmsg("검색 결과가 없어요. 지도를 직접 눌러 위치를 찍어 보세요."); return}
    mmsg("결과를 누르면 그 위치로 이동해요.");
    list.forEach(function(r){
      var b=document.createElement("button"); b.type="button"; b.textContent=r.name;
      b.onclick=function(){ setPin(r.lat,r.lng); map.setView([r.lat,r.lng],17); box.innerHTML=""; mmsg("핀을 끌어 미세하게 옮길 수 있어요. 맞으면 '이 위치로'를 누르세요.") };
      box.appendChild(b);
    });
  }
  function short(n){return String(n).split(",").slice(0,3).join(",").trim()}
  function doSearch(q){
    q=q.trim(); if(!q) return; mmsg("검색 중…"); $("mRes").innerHTML="";
    fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=ko&countrycodes=jp&q="+encodeURIComponent(q))
      .then(function(r){if(!r.ok) throw new Error("n"); return r.json()})
      .then(function(a){ if(!a.length) throw new Error("empty"); return a.map(function(x){return {name:short(x.display_name),lat:+x.lat,lng:+x.lon}}) })
      .catch(function(){
        return fetch("https://photon.komoot.io/api/?limit=5&bbox=122,24,146,46&q="+encodeURIComponent(q))
          .then(function(r){if(!r.ok) throw new Error("p"); return r.json()})
          .then(function(j){return (j.features||[]).map(function(f){var p=f.properties||{}; return {name:short([p.name,p.city||p.state,p.country].filter(Boolean).join(", ")),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}})});
      })
      .then(showResults)
      .catch(function(){mmsg("검색이 안 돼요(인터넷 확인). 지도를 직접 눌러 위치를 찍을 수 있어요.")});
  }
  $("fLoc").onclick=function(){
    mapDlg.showModal(); mmsg("지도 불러오는 중…"); $("mRes").innerHTML="";
    $("mQ").value=$("fPlace").value.trim();
    loadLeaflet().then(function(){
      if(!map){
        map=L.map("mapBox").setView([35.68,139.76],11);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
        map.on("click",function(e){setPin(e.latlng.lat,e.latlng.lng); mmsg("핀을 끌어 미세하게 옮길 수 있어요. 맞으면 '이 위치로'를 누르세요.")});
      }
      setTimeout(function(){
        map.invalidateSize();
        if(marker){marker.remove(); marker=null}
        tmp=pin?{lat:pin.lat,lng:pin.lng}:null;
        if(pin){ setPin(pin.lat,pin.lng); map.setView([pin.lat,pin.lng],16); mmsg("핀을 끌거나 지도를 눌러 옮길 수 있어요.") }
        else { mmsg("지도를 눌러 위치를 찍으세요. 위 검색창으로 찾을 수도 있어요."); if($("mQ").value) doSearch($("mQ").value) }
      },60);
    }).catch(function(){mmsg("지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.")});
  };
  $("mGo").onclick=function(){doSearch($("mQ").value)};
  $("mQ").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault(); doSearch($("mQ").value)}};
  $("mCancel").onclick=function(){mapDlg.close()};
  $("mClear").onclick=function(){pin=null; showLoc(); mapDlg.close()};
  $("mOk").onclick=function(){ if(!tmp){mmsg("먼저 지도에서 위치를 찍어 주세요."); return} pin={lat:tmp.lat,lng:tmp.lng}; showLoc(); mapDlg.close() };

  /* ---------- 헤더 입력 / 탭 ---------- */
  var titleT=null;
  $("title").oninput=function(e){clearTimeout(titleT); var val=e.target.value; titleT=setTimeout(function(){if(val!==meta().title) setRec("meta",{title:val})},500)};
  function setView(v){view=v; lsSet(K_VIEW,v); render(); window.scrollTo(0,0)}
  $("tPlan").onclick=function(){setView("plan")}; $("tPack").onclick=function(){setView("pack")};
  $("packForm").onsubmit=function(e){
    e.preventDefault(); var inp=$("packIn"), t=inp.value.trim(); if(!t) return;
    setRec("p:"+uid(),{text:t,done:false,by:"",doneBy:""}); inp.value=""; inp.focus();
  };
  $("copyUrl").onclick=function(){
    var url=location.origin+location.pathname, b=$("copyUrl");
    try{navigator.clipboard.writeText(url).then(function(){b.textContent="복사됨"},function(){b.textContent=url})}catch(e){b.textContent=url}
  };

  /* ---------- 실시간 공유 (ntfy.sh 중계) ---------- */
  function b64(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
  function unb64(t){t=t.replace(/-/g,"+").replace(/_/g,"/"); while(t.length%4)t+="="; return decodeURIComponent(escape(atob(t)))}
  function enc(arr){return "j1."+b64(JSON.stringify(arr))}
  function chunks(recs){
    var out=[], c=[];
    recs.forEach(function(r){
      if(c.length&&enc(c.concat([r])).length>2800){out.push(c); c=[r]} else c.push(r);
    });
    if(c.length) out.push(c); return out;
  }
  function status(on){
    var s=$("sync"); s.className=on?"on":"";
    s.lastChild.textContent=on?"공유 중 · 친구와 실시간 연결":"오프라인 · 이 폰에 저장됨, 연결되면 자동으로 맞춰요";
  }
  var flushT=null, flushing=false;
  function scheduleFlush(){clearTimeout(flushT); flushT=setTimeout(flush,400)}
  function sendKeys(keys){
    var recs=[]; keys.forEach(function(k){ if(R[k]) recs.push({k:k,v:R[k].v,t:R[k].t}) });
    return Promise.all(chunks(recs).map(function(c){
      return fetch(BASE,{method:"POST",body:enc(c)}).then(function(r){if(!r.ok) throw new Error("http "+r.status)});
    }));
  }
  function flush(){
    if(flushing||!navigator.onLine) return;
    var keys=Object.keys(dirty); if(!keys.length) return;
    var sent={}; keys.forEach(function(k){sent[k]=dirty[k]});
    flushing=true;
    sendKeys(keys).then(function(){
      keys.forEach(function(k){ if(dirty[k]===sent[k]) delete dirty[k] }); saveD();
    }).catch(function(){}).then(function(){flushing=false; if(Object.keys(dirty).length) setTimeout(flush,8000)});
  }
  function handle(text){
    if(typeof text!=="string"||text.indexOf("j1.")!==0) return;
    var arr; try{arr=JSON.parse(unb64(text.slice(3)))}catch(e){return}
    if(!Array.isArray(arr)) return;
    var changed=false;
    arr.forEach(function(r){
      if(!r||!validKey(r.k)||typeof r.t!=="number"||!isFinite(r.t)) return;
      var v=clean(r.k,r.v); if(v===undefined) return;
      if(!seenT[r.k]||r.t>seenT[r.k]) seenT[r.k]=r.t;
      if(merge(r.k,{v:v,t:r.t})) changed=true;
    });
    if(changed){saveR(); renderSoon()}
  }
  function resync(){
    // 서버에 없는(또는 오래된) 내 기록을 다시 올림 (서버 보관은 12시간뿐이라)
    var keys=[]; for(var k in R){ if(R[k].t>1&&(!seenT[k]||seenT[k]<R[k].t)) keys.push(k) }
    if(keys.length) sendKeys(keys).catch(function(){});
    flush();
  }
  var es=null, syncT=null, retryT=null;
  function connect(){
    if(es||!navigator.onLine||!window.EventSource) return;
    seenT={};
    try{es=new EventSource(BASE+"/sse?since=all")}catch(e){return}
    es.onopen=function(){status(true); clearTimeout(syncT); syncT=setTimeout(resync,2500)};
    es.onmessage=function(e){ var m; try{m=JSON.parse(e.data)}catch(x){return} if(m&&m.event==="message") handle(m.message) };
    es.onerror=function(){ status(false); if(es){es.close(); es=null} clearTimeout(retryT); retryT=setTimeout(connect,5000) };
  }
  function disconnect(){ if(es){es.close(); es=null} status(false) }
  window.addEventListener("online",function(){connect(); scheduleFlush()});
  window.addEventListener("offline",disconnect);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden){ connect(); flush(); render() } });
  setInterval(function(){ if(!document.hidden&&view==="plan"&&!dlg.open) render() },60000);

  /* ---------- 시작 ---------- */
  loadState();
  view=lsGet(K_VIEW)==="pack"?"pack":"plan";
  var td=todayIdx(), st=parseInt(lsGet(K_TAB),10);
  cur=td>=0?td:(st>=0&&st<DAYS?st:0);
  status(false); render(); connect(); flush();

  if("serviceWorker" in navigator && location.protocol==="https:"){
    window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
  }
})();
</script>
</body></html>
